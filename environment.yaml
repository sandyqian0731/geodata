name: geodata
channels:
  - conda-forge
dependencies:
  - python>=3.10
  # GIS dependencies have to come all from conda-forge
  - pyproj>=3.6.1
  - rasterio=1.4.0
  - rioxarray=0.14.0
  - shapely>=2.0.6
  - geopandas>=1.0.1
  - libgdal
  - pip
  - pip:
      - numpy<2
      - scipy>=1.8.0
      - pandas>=2.2.3
      - bottleneck>=1.3.6
      - numexpr==2.10.1
      - xarray>=2024.9.0
      - boto3==1.26.46
      - toolz>=0.12.1
      - requests>=2.32.3
      - matplotlib==3.9.2
      - pyyaml>=6.0.2
      - dask[distributed]>=2024.9.0
      - tqdm>=4.66.5
      - h5netcdf>=1.6.1
      - cdsapi>=0.7.5

      # Required for the pvlib solar model (geodata.model.pvlib)
      - pvlib>=0.12.0
      - timezonefinder>=6.5.9

      # Optional: only needed for the experimental HRRR dataset
      # (geodata.datasets.hrrr), not used by this project's ERA5-based
      # pipeline.
      # - herbie-data>=2025.5.0
